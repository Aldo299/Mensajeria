<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App 2 - Chats Grupales</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Fuente Roboto de Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #121212;
      color: #ffffff;  /* Texto en blanco */
      font-family: 'Roboto', sans-serif;
    }
    h1, h2 {
      font-weight: 500;
      color: #ffffff;
    }
    .card {
      background-color: #1e1e1e;
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .card-header {
      background-color: #272727;
      color: #ffffff;
      font-size: 1.125rem;
      font-weight: 500;
      border-bottom: 1px solid #3a3a3a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-footer {
      background-color: #272727;
      border-top: 1px solid #3a3a3a;
    }
    .chat-box {
      max-height: 300px;
      overflow-y: auto;
      padding: 15px;
      background: #2c2c2c;
      border-radius: 8px;
      border: 1px solid #444;
    }
    .message {
      margin-bottom: 15px;
      padding: 10px 15px;
      background-color: #333333;
      border-left: 4px solid #0d6efd;
      border-radius: 8px;
      transition: background-color 0.3s;
      color: #ffffff;
    }
    .message:hover {
      background-color: #3a3a3a;
    }
    .timestamp {
      font-size: 0.8rem;
      color: #b0b0b0;
      margin-top: 5px;
    }
    input, textarea {
      background-color: #1e1e1e;
      border: 1px solid #444;
      color: #ffffff;
      border-radius: 6px;
      transition: box-shadow 0.3s;
    }
    input::placeholder,
    textarea::placeholder {
      color: #a0a0a0;
    }
    label {
      color: #ffffff;
    }
    /* Forzar que el nombre de la sala se muestre en blanco */
    #activeRoomName {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="container py-4">
    <h1 class="mb-4 text-center">App 2 - Chats Grupales</h1>
    
    <!-- Formulario para ingresar el nombre de usuario -->
    <div class="card" id="usernameCard">
      <div class="card-body">
        <form id="userForm" class="row g-3">
          <div class="col-md-8">
            <input type="text" class="form-control" id="username" placeholder="Ingresa tu nombre de usuario" required>
          </div>
          <div class="col-md-4">
            <button type="submit" class="btn btn-success w-100">Guardar Nombre</button>
          </div>
        </form>
      </div>
    </div>
    
    <!-- Sección para listar salas disponibles (se muestra tras ingresar el nombre) -->
    <div class="card" id="roomListCard" style="display: none;">
      <div class="card-header">Salas Disponibles</div>
      <div class="card-body" id="roomList">
        <p class="text-center">Cargando salas...</p>
      </div>
    </div>
    
    <!-- Sección de chat de sala (se muestra tras unirse a una sala) -->
    <div class="card" id="chatCard" style="display: none;">
      <div class="card-header">
        <span>Chat en Sala: <span id="activeRoomName"></span></span>
        <!-- Botón para cambiar de sala -->
        <button class="btn btn-sm btn-outline-light" onclick="changeRoom()">Cambiar Sala</button>
      </div>
      <div class="card-body chat-box" id="chatBox">
        <p class="text-center">No hay mensajes.</p>
      </div>
      <div class="card-footer">
        <form id="sendMessageForm" class="d-flex">
          <input type="text" class="form-control me-2" id="chatMessage" placeholder="Escribe tu mensaje" required>
          <button type="submit" class="btn btn-success">Enviar</button>
        </form>
      </div>
    </div>
    
  </div>
  
  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let username = '';
    let activeRoom = '';
    
    // Guardar el nombre de usuario
    document.getElementById('userForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('username');
      if (usernameInput.value.trim() === '') {
        alert('Por favor, ingresa tu nombre.');
        return;
      }
      username = usernameInput.value.trim();
      alert('Nombre guardado: ' + username);
      // Ocultar el formulario de nombre y mostrar la lista de salas
      document.getElementById('usernameCard').style.display = 'none';
      document.getElementById('roomListCard').style.display = 'block';
      loadRooms();
    });
    
    // Cargar las salas disponibles
    async function loadRooms() {
      try {
        const response = await fetch('/rooms');
        const rooms = await response.json();
        const roomListDiv = document.getElementById('roomList');
        roomListDiv.innerHTML = '';
        if (rooms.length === 0) {
          roomListDiv.innerHTML = '<p class="text-center">No hay salas creadas.</p>';
          return;
        }
        rooms.forEach(room => {
          const roomDiv = document.createElement('div');
          roomDiv.classList.add('d-flex', 'justify-content-between', 'align-items-center', 'mb-2');
          roomDiv.innerHTML = `
            <span><strong>${room.room}</strong> (Usuarios: ${room.user_count})</span>
            <button class="btn btn-sm btn-outline-success" onclick="joinRoom('${room.room}')">Unirse</button>
          `;
          roomListDiv.appendChild(roomDiv);
        });
      } catch (error) {
        console.error('Error al cargar salas:', error);
      }
    }
    
    // Función para unirse a una sala
    async function joinRoom(roomName) {
      activeRoom = roomName;
      try {
        const response = await fetch('/rooms/join', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ room: roomName, user: username })
        });
        const result = await response.json();
        if (response.ok) {
          alert('Te has unido a la sala: ' + roomName);
          document.getElementById('activeRoomName').textContent = roomName;
          // Ocultar la lista de salas y mostrar el chat
          document.getElementById('roomListCard').style.display = 'none';
          document.getElementById('chatCard').style.display = 'block';
          loadMessages();
        } else {
          alert('Error: ' + result.error);
        }
      } catch (error) {
        console.error('Error al unirse a la sala:', error);
      }
    }
    
    // Función para cambiar de sala (mostrar la lista de salas nuevamente)
    function changeRoom() {
      activeRoom = '';
      // Ocultar el chat y mostrar la lista de salas
      document.getElementById('chatCard').style.display = 'none';
      document.getElementById('roomListCard').style.display = 'block';
      loadRooms();
    }
    
    // Enviar mensaje en la sala activa
    document.getElementById('sendMessageForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const message = document.getElementById('chatMessage').value.trim();
      if (!message) return;
      try {
        const response = await fetch('/send', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ room: activeRoom, sender: username, message: message })
        });
        const result = await response.json();
        if (response.ok) {
          document.getElementById('chatMessage').value = '';
          loadMessages();
        } else {
          alert('Error: ' + result.error);
        }
      } catch (error) {
        console.error('Error al enviar mensaje:', error);
      }
    });
    
    // Cargar mensajes de la sala activa
    async function loadMessages() {
      try {
        const response = await fetch('/messages?room=' + encodeURIComponent(activeRoom));
        const messages = await response.json();
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = '';
        if (messages.length === 0) {
          chatBox.innerHTML = '<p class="text-center">No hay mensajes.</p>';
          return;
        }
        messages.forEach(msg => {
          const msgDiv = document.createElement('div');
          msgDiv.classList.add('message');
          msgDiv.innerHTML = `
            <strong>${msg.sender}</strong>: ${msg.message}
            <div class="timestamp">${new Date(msg.timestamp).toLocaleString()}</div>
          `;
          chatBox.appendChild(msgDiv);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
      } catch (error) {
        console.error('Error al cargar mensajes:', error);
      }
    }
    
    // Actualizar mensajes cada 5 segundos si se ha unido a una sala.
    setInterval(() => {
      if (activeRoom) loadMessages();
    }, 5000);
  </script>
</body>
</html>
