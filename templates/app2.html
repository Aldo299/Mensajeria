<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>App 2 - Chats Grupales</title>
  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Fuente Roboto de Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <!-- Cliente de Socket.IO -->
  <script
    src="https://cdn.socket.io/4.5.4/socket.io.min.js"
    integrity="sha384-YOUR_INTEGRITY_HASH"
    crossorigin="anonymous"
  ></script>
  <style>
    body {
      background: linear-gradient(to right, #198754, #ffffff);
      font-family: 'Roboto', sans-serif;
      color: #2c3e50;
    }
    h1,
    h2 {
      font-weight: 600;
      color: white;
    }
    .card {
      background-color: #1e1e1e;
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .card-header {
      background-color: #272727;
      color: #ffffff;
      font-size: 1.125rem;
      font-weight: 500;
      border-bottom: 1px solid #3a3a3a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-footer {
      background-color: #272727;
      border-top: 1px solid #3a3a3a;
    }
    .chat-box {
      max-height: 300px;
      overflow-y: auto;
      padding: 15px;
      background: #2c2c2c;
      border-radius: 8px;
      border: 1px solid #444;
    }
    .message {
      margin-bottom: 15px;
      padding: 10px 15px;
      background-color: #333333;
      border-left: 4px solid #0d6efd;
      border-radius: 8px;
      transition: background-color 0.3s;
      color: #ffffff;
    }
    .message:hover {
      background-color: #3a3a3a;
    }
    .timestamp {
      font-size: 0.8rem;
      color: #b0b0b0;
      margin-top: 5px;
      text-align: right;
    }
    input,
    textarea {
      background-color: #1e1e1e;
      border: 1px solid #444;
      color: #ffffff;
      border-radius: 6px;
      transition: box-shadow 0.3s;
    }
    input::placeholder,
    textarea::placeholder {
      color: #a0a0a0;
    }
    label {
      color: #ffffff;
    }
    #activeRoomName {
      color: #ffffff;
    }
    #roomList,
    #roomList * {
      color: #ffffff !important;
    }
  </style>
</head>

<body>
  <div class="container py-4">
    <h1 class="mb-4 text-center">APP 2 - CHAT GRUPALES</h1>

    <!-- Ingresar usuario -->
    <div class="card mb-4" id="usernameCard">
      <div class="card-body">
        <form id="userForm" class="row g-3">
          <div class="col-md-8">
            <input
              type="text"
              class="form-control"
              id="username"
              placeholder="Ingresa tu nombre de usuario"
              required
            />
          </div>
          <div class="col-md-4">
            <button type="submit" class="btn btn-success w-100">
              Guardar Nombre
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Lista de salas -->
    <div class="card mb-4" id="roomListCard" style="display: none;">
      <div class="card-header">Salas Disponibles</div>
      <div class="card-body" id="roomList">
        <p class="text-center">Cargando salas...</p>
      </div>
    </div>

    <!-- Chat -->
    <div class="card mb-4" id="chatCard" style="display: none;">
      <div class="card-header">
        <span>Chat en Sala: <span id="activeRoomName"></span></span>
        <button class="btn btn-sm btn-outline-light" onclick="changeRoom()">
          Cambiar Sala
        </button>
      </div>
      <div class="card-body chat-box" id="chatBox">
        <p class="text-center">No hay mensajes.</p>
      </div>
      <div class="card-footer">
        <form id="sendMessageForm" class="d-flex">
          <input
            type="text"
            class="form-control me-2"
            id="chatMessage"
            placeholder="Escribe tu mensaje"
            required
          />
          <button type="submit" class="btn btn-success">Enviar</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const socket = io();
    let username = '';
    let activeRoom = '';

    // Registro de usuario
    document.getElementById('userForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const inp = document.getElementById('username');
      if (!inp.value.trim()) return alert('Ingresa tu nombre.');
      username = inp.value.trim();
      socket.emit('register', { username });
    });

    socket.on('register_success', () => {
      document.getElementById('usernameCard').style.display = 'none';
      document.getElementById('roomListCard').style.display = 'block';
      socket.emit('list_rooms');
    });
    socket.on('register_error', ({ error }) => alert(error));

    // Listado de salas
    socket.on('rooms_list', (rooms) => {
      const div = document.getElementById('roomList');
      div.innerHTML = rooms.length
        ? rooms
            .map(
              (r) => `
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span><strong>${r.room}</strong> (Usuarios: ${r.user_count})</span>
          <button class="btn btn-sm btn-outline-success" onclick="joinRoom('${r.room}')">Unirse</button>
        </div>`
            )
            .join('')
        : '<p class="text-center">No hay salas creadas.</p>';
    });

    // Unirse a sala
    window.joinRoom = (room) => {
      activeRoom = room;
      socket.emit('join_room', { room, user: username });
    };
    socket.on('join_room_success', () => {
      document.getElementById('roomListCard').style.display = 'none';
      document.getElementById('chatCard').style.display = 'block';
      document.getElementById('activeRoomName').textContent = activeRoom;
      socket.emit('get_messages', { room: activeRoom });
    });
    socket.on('join_room_error', ({ error }) => alert(error));

    // Historial de mensajes
    socket.on('messages_history', (msgs) => {
      const box = document.getElementById('chatBox');
      box.innerHTML = msgs.length
        ? msgs.map(renderMessage).join('')
        : '<p class="text-center">No hay mensajes.</p>';
      box.scrollTop = box.scrollHeight;
    });

    // Nuevo mensaje en tiempo real
    socket.on('new_message', (msg) => {
      if (msg.room === activeRoom) {
        const box = document.getElementById('chatBox');
        box.insertAdjacentHTML('beforeend', renderMessage(msg));
        box.scrollTop = box.scrollHeight;
      }
    });
    socket.on('send_message_error', ({ error }) => alert(error));

    // Enviar mensaje
    document.getElementById('sendMessageForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const txt = document.getElementById('chatMessage').value.trim();
      if (!txt) return;
      socket.emit('send_message', {
        room: activeRoom,
        sender: username,
        message: txt
      });
      document.getElementById('chatMessage').value = '';
    });

    // Cambiar sala
    window.changeRoom = () => {
      activeRoom = '';
      document.getElementById('chatCard').style.display = 'none';
      document.getElementById('roomListCard').style.display = 'block';
      socket.emit('list_rooms');
    };

    // Helper para renderizar un mensaje
    function renderMessage(msg) {
      return `
      <div class="message">
        <strong>${msg.sender}</strong>: ${msg.message}
        <div class="timestamp">${new Date(msg.timestamp).toLocaleString()}</div>
      </div>`;
    }
  </script>
</body>
</html>
