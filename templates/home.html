<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio - App de Mensajería</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Fuente Roboto de Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <!-- Cliente de Socket.IO (para consistencia con App 1 y App 2) -->
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"
    integrity="sha384-YOUR_INTEGRITY_HASH" crossorigin="anonymous"></script>
  <!-- Estilos personalizados -->
  <style>
    body {
      background: linear-gradient(135deg, #0d6efd, #198754);
      font-family: 'Roboto', sans-serif;
      color: #ffffff;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container-custom {
      max-width: 500px;
      background-color: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    h1 {
      font-weight: 500;
      margin-bottom: 20px;
      color: #343a40;
    }
    p {
      font-size: 1.125rem;
      color: #343a40;
      margin-bottom: 0;
    }
    .btn-custom {
      font-size: 1.1rem;
      padding: 10px 20px;
      transition: transform 0.3s;
      margin: 10px 0;
    }
    .btn-custom:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container container-custom">
    <h1>BIENVENIDO A LA APLICACIÓN DE MENSAJERÍA</h1>
    <p>Elige una de las siguientes opciones:</p>
    <div class="d-grid gap-3">
      <a href="{{ url_for('app1') }}" class="btn btn-primary btn-custom">APP 1 ADMINISTRADOR</a>
      <a href="{{ url_for('app2') }}" class="btn btn-success btn-custom">APP 2 USUARIO</a>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
