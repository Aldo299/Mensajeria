<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App 1 - Mensajería</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Fuente moderna de Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #f1f3f5;
      font-family: 'Roboto', sans-serif;
    }
    h1 {
      font-weight: 500;
    }
    .card {
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    .card-header {
      background-color: #ffffff;
      border-bottom: 1px solid #dee2e6;
      font-size: 1.125rem;
      font-weight: 500;
    }
    .card-footer {
      background-color: #ffffff;
      border-top: 1px solid #dee2e6;
    }
    .chat-box {
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid #ced4da;
      padding: 15px;
      background: #fff;
      border-radius: 8px;
    }
    .message {
      margin-bottom: 15px;
      padding: 10px 15px;
      background-color: #e9ecef;
      border-left: 4px solid #0d6efd;
      border-radius: 8px;
      transition: background-color 0.3s;
    }
    .message:hover {
      background-color: #dee2e6;
    }
    .timestamp {
      font-size: 0.8rem;
      color: #6c757d;
      margin-top: 5px;
    }
    input, textarea {
      background-color: #fff;
      border: 1px solid #ced4da;
      color: #495057;
      border-radius: 6px;
      transition: box-shadow 0.3s;
    }
    input:focus, textarea:focus {
      box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
    }
  </style>
</head>
<body>
  <div class="container py-4">
    <h1 class="mb-4 text-center">App 1 - Mensajería</h1>
    <div class="row justify-content-center">
      <div class="col-md-8">
        <!-- Formulario para enviar mensaje -->
        <div class="card mb-4">
          <div class="card-body">
            <form id="messageForm">
              <div class="mb-3">
                <label for="sender" class="form-label">Emisor</label>
                <input type="text" class="form-control" id="sender" placeholder="Tu nombre">
              </div>
              <div class="mb-3">
                <label for="recipient" class="form-label">Receptor</label>
                <input type="text" class="form-control" id="recipient" placeholder="Nombre del receptor">
              </div>
              <div class="mb-3">
                <label for="message" class="form-label">Mensaje</label>
                <textarea class="form-control" id="message" rows="3" placeholder="Escribe tu mensaje"></textarea>
              </div>
              <button type="submit" class="btn btn-primary w-100">Enviar Mensaje</button>
            </form>
          </div>
        </div>

        <!-- Área de mensajes -->
        <div class="card">
          <div class="card-header">Mensajes Recibidos</div>
          <div id="chatBox" class="card-body chat-box"></div>
          <div class="card-footer text-center">
            <!-- Botón con el texto actualizado a "Borrar Mensajes" -->
            <button id="refreshBtn" class="btn btn-secondary">Borrar Mensajes</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Función para formatear la fecha.
    function formatTimestamp(timestamp) {
      const date = new Date(timestamp);
      return date.toLocaleString();
    }

    // Actualizar el chat (funcionalidad se conserva)
    async function updateChat() {
      try {
        const response = await fetch('/messages');
        const data = await response.json();
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = '';
        
        if (data.length === 0) {
          chatBox.innerHTML = '<p class="text-center">No hay mensajes.</p>';
          return;
        }

        data.forEach(msg => {
          const msgDiv = document.createElement('div');
          msgDiv.classList.add('message');
          msgDiv.innerHTML = `
            <strong>${msg.sender}</strong> ➜ <strong>${msg.recipient}</strong>: ${msg.message}
            <div class="timestamp">${formatTimestamp(msg.timestamp)}</div>
          `;
          chatBox.appendChild(msgDiv);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
      } catch (error) {
        console.error('Error al obtener mensajes:', error);
      }
    }

    // Enviar mensaje
    document.getElementById('messageForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const sender = document.getElementById('sender').value.trim();
      const recipient = document.getElementById('recipient').value.trim();
      const message = document.getElementById('message').value.trim();

      if (!sender || !recipient || !message) {
        alert("Por favor, completa todos los campos.");
        return;
      }

      try {
        const response = await fetch('/send', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ sender, recipient, message })
        });
        const result = await response.json();
        if (response.ok) {
          document.getElementById('message').value = '';
          updateChat();
        } else {
          alert("Error: " + (result.error || "No se pudo enviar el mensaje."));
        }
      } catch (error) {
        console.error('Error al enviar mensaje:', error);
      }
    });

    document.getElementById('refreshBtn').addEventListener('click', updateChat);
    setInterval(updateChat, 5000);
    updateChat();
  </script>
</body>
</html>
