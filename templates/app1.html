<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App 1 - Administrador de Chats Grupales</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Fuente moderna de Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #0d6efd, #ffffff);
      font-family: 'Roboto', sans-serif;
      color: #2c3e50;
    }
    h1, h2 {
      font-weight: 600;
      color: white;
    }
    .card {
      background-color: #1e1e1e;
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .card-header {
      background: linear-gradient(135deg, #0d6efd 0%, #0044cc 100%);
      color: white;
      font-weight: 500;
      text-align: center;
      border-radius: 15px 15px 0 0;
    }
    .card-footer {
      background-color: #272727;
      border-top: 1px solid #3a3a3a;
    }
    .chat-box {
      max-height: 300px;
      overflow-y: auto;
      padding: 15px;
      background: #ffffff;
      border-radius: 8px;
      border: 1px solid #ced4da;
    }
    .message {
      margin-bottom: 12px;
      padding: 12px 16px;
      background-color: #f8f9fa;
      border-left: 5px solid #0d6efd;
      border-radius: 10px;
      transition: all 0.3s ease-in-out;
    }
    .message:hover {
      background-color: #e2e6ea;
      transform: scale(1.02);
    }
    .timestamp {
      font-size: 0.85rem;
      color: #7b8a8b;
      margin-top: 4px;
      text-align: right;
    }
    .btn {
      font-weight: 500;
      border-radius: 10px;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background: #0d6efd;
      border: none;
      box-shadow: 0 3px 6px rgba(13,110,253,0.3);
    }
    .btn-primary:hover {
      background: #0b5ed7;
      box-shadow: 0 5px 10px rgba(13,110,253,0.4);
    }
    .btn-success {
      background: #198754;
      border: none;
      box-shadow: 0 3px 6px rgba(25,135,84,0.3);
    }
    .btn-success:hover {
      background: #157347;
      box-shadow: 0 5px 10px rgba(25,135,84,0.4);
    }
    .btn-danger {
      background: #dc3545;
      border: none;
      box-shadow: 0 3px 6px rgba(220,53,69,0.3);
    }
    .btn-danger:hover {
      background: #bb2d3b;
      box-shadow: 0 5px 10px rgba(220,53,69,0.4);
    }
    .input-group input, .form-control {
      border-radius: 10px;
      border: 1px solid #ced4da;
      padding: 10px;
    }
    .input-group input:focus, .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 8px rgba(13,110,253,0.3);
    }
  </style>
  <!-- Cliente de Socket.IO -->
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"
    integrity="sha384-YOUR_INTEGRITY_HASH" crossorigin="anonymous"></script>
</head>

<body>
  <div class="container py-4">
    <h1 class="mb-4 text-center">APP 1 - ADMINISTRADOR DE CHATS GRUPALES</h1>

    <!-- Ingresar nombre de admin -->
    <div class="card mb-4" id="adminCard">
      <div class="card-body">
        <form id="adminForm" class="row g-3">
          <div class="col-md-8">
            <input type="text" class="form-control" id="adminName" placeholder="Ingresa tu nombre de administrador" required>
          </div>
          <div class="col-md-4">
            <button type="submit" class="btn btn-primary w-100">Guardar Nombre</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Crear sala -->
    <div class="card mb-4" id="createRoomCard" style="display: none;">
      <div class="card-header">Crear Nueva Sala</div>
      <div class="card-body">
        <form id="createRoomForm">
          <div class="mb-3">
            <input type="text" class="form-control" id="roomName" placeholder="Nombre de la sala" required>
          </div>
          <button type="submit" class="btn btn-success w-100">Crear Sala</button>
        </form>
      </div>
    </div>

    <!-- Listar salas -->
    <div class="card mb-4" id="roomListCard" style="display: none;">
      <div class="card-header">Salas Existentes</div>
      <div class="card-body" id="roomList">
        <p class="text-center">Cargando salas...</p>
      </div>
    </div>

    <!-- Chat -->
    <div class="card mb-4" id="chatCard" style="display: none;">
      <div class="card-header">Chat: <span id="activeRoomName"></span></div>
      <div class="card-body chat-box" id="chatBox">
        <p class="text-center">No hay mensajes.</p>
      </div>
      <div class="card-footer">
        <form id="sendMessageForm" class="d-flex">
          <input type="text" class="form-control me-2" id="chatMessage" placeholder="Escribe tu mensaje" required>
          <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
      </div>
    </div>

    <!-- Remover usuario -->
    <div class="card mb-4" id="removeUserCard" style="display: none;">
      <div class="card-header">
        Remover Usuario de la Sala <span id="activeRoomForRemoval"></span>
      </div>
      <div class="card-body">
        <form id="removeUserForm" class="row g-3">
          <div class="col-md-8">
            <input type="text" class="form-control" id="removeUserName" placeholder="Nombre del usuario a remover" required>
          </div>
          <div class="col-md-4">
            <button type="submit" class="btn btn-danger w-100">Remover Usuario</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const socket = io();
    let adminName = '';
    let activeRoom = '';

    // — SOCKET.IO LISTENERS —
    socket.on('register_success', () => {
      // ocultar el formulario de admin y mostrar controles
      document.getElementById('adminCard').style.display = 'none';
      document.getElementById('createRoomCard').style.display = 'block';
      document.getElementById('roomListCard').style.display = 'block';
      loadRooms();
    });
    socket.on('register_error', ({ error }) => alert('Error: ' + error));

    socket.on('rooms_list', rooms => {
      const div = document.getElementById('roomList');
      div.innerHTML = rooms.length
        ? rooms.map(r => `
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span><strong>${r.room}</strong> (Usuarios: ${r.user_count})</span>
              <button class="btn btn-sm btn-outline-primary" onclick="selectRoom('${r.room}')">Seleccionar</button>
            </div>
          `).join('')
        : '<p class="text-center">No hay salas creadas.</p>';
    });

    socket.on('create_room_success', ({ room }) => {
      document.getElementById('roomName').value = '';
      loadRooms();
    });
    socket.on('create_room_error', ({ error }) => alert('Error: ' + error));

    socket.on('join_room_success', () => {
      document.getElementById('chatCard').style.display = 'block';
      document.getElementById('removeUserCard').style.display = 'block';
      loadMessages();
    });
    socket.on('join_room_error', ({ error }) => alert('Error: ' + error));

    socket.on('messages_history', messages => {
      const box = document.getElementById('chatBox');
      box.innerHTML = messages.length
        ? messages.map(appendMessage).join('')
        : '<p class="text-center">No hay mensajes.</p>';
      box.scrollTop = box.scrollHeight;
    });
    socket.on('get_messages_error', ({ error }) => alert('Error: ' + error));

    socket.on('new_message', msg => {
      if (msg.room === activeRoom) {
        appendMessage(msg, true);
      }
    });
    socket.on('send_message_error', ({ error }) => alert('Error: ' + error));

    socket.on('user_removed', ({ user }) => {
      alert(`Usuario removido: ${user}`);
      loadRooms();
    });
    socket.on('remove_user_error', ({ error }) => alert('Error: ' + error));

    // — UI HANDLERS —
    document.getElementById('adminForm').addEventListener('submit', e => {
      e.preventDefault();
      const inp = document.getElementById('adminName');
      if (!inp.value.trim()) return alert('Ingresa tu nombre.');
      adminName = inp.value.trim();
      socket.emit('register', { username: adminName });
    });

    document.getElementById('createRoomForm').addEventListener('submit', e => {
      e.preventDefault();
      const room = document.getElementById('roomName').value.trim();
      if (!room) return;
      socket.emit('create_room', { room, admin: adminName });
    });

    function loadRooms() {
      socket.emit('list_rooms');
    }

    window.selectRoom = room => {
      activeRoom = room;
      document.getElementById('activeRoomName').textContent = room;
      document.getElementById('activeRoomForRemoval').textContent = room;
      socket.emit('join_room', { room, user: adminName });
    };

    document.getElementById('sendMessageForm').addEventListener('submit', e => {
      e.preventDefault();
      const txt = document.getElementById('chatMessage').value.trim();
      if (!txt) return;
      socket.emit('send_message', { room: activeRoom, sender: adminName, message: txt });
      document.getElementById('chatMessage').value = '';
    });

    function loadMessages() {
      socket.emit('get_messages', { room: activeRoom });
    }

    document.getElementById('removeUserForm').addEventListener('submit', e => {
      e.preventDefault();
      const u = document.getElementById('removeUserName').value.trim();
      if (!u) return;
      socket.emit('remove_user', { room: activeRoom, admin: adminName, user: u });
      document.getElementById('removeUserName').value = '';
    });

    function appendMessage(msg, scroll = false) {
      const box = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = 'message';
      div.innerHTML = `
        <strong>${msg.sender}</strong>: ${msg.message}
        <div class="timestamp">${new Date(msg.timestamp).toLocaleString()}</div>
      `;
      box.appendChild(div);
      if (scroll) box.scrollTop = box.scrollHeight;
    }
  </script>
</body>

</html>
